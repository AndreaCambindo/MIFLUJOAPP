<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MiFlujo</title>
<meta name="description" content="Pagos mensuales, agenda, flujo de caja, inversiones y créditos. Tus datos viven en tu propio Google Sheets.">
<meta name="theme-color" content="#047857">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MiFlujo">
<style>
:root{
  --bg:#f3f6f4;--card:#fff;--ink:#12201a;--mute:#62776d;--line:#e2e9e5;--soft:#f0f4f2;
  --acc:#059669;--acc-d:#047857;--acc-bg:#e3f5ec;
  --warn:#b45309;--warn-bg:#fdf1de;--bad:#c81e1e;--bad-bg:#fcebeb;--info:#1d4ed8;--info-bg:#e7eefc;
  --c-fijo:#f59e0b;--c-cuota:#f43f5e;--c-gasto:#3b82f6;--c-libre:#10b981;
  --shadow:0 1px 2px rgba(16,40,30,.06),0 6px 18px rgba(16,40,30,.05);
  color-scheme:light;
}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#0d1411;--card:#16201b;--ink:#e7f0eb;--mute:#8aa196;--line:#24322b;--soft:#1c2923;
  --acc:#34d399;--acc-d:#10b981;--acc-bg:#12342a;
  --warn:#fbbf24;--warn-bg:#3a2d10;--bad:#fb7185;--bad-bg:#3b1a20;--info:#93b4ff;--info-bg:#18274a;
  --shadow:0 1px 2px rgba(0,0,0,.3);color-scheme:dark}}
:root[data-theme=dark]{
  --bg:#0d1411;--card:#16201b;--ink:#e7f0eb;--mute:#8aa196;--line:#24322b;--soft:#1c2923;
  --acc:#34d399;--acc-d:#10b981;--acc-bg:#12342a;
  --warn:#fbbf24;--warn-bg:#3a2d10;--bad:#fb7185;--bad-bg:#3b1a20;--info:#93b4ff;--info-bg:#18274a;
  --shadow:0 1px 2px rgba(0,0,0,.3);color-scheme:dark}

*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sr{position:absolute;left:-9999px}

.app{min-height:100dvh}
.col{min-width:0}
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#047857,#0f766e);display:grid;place-items:center;color:#fff;flex:none}
.logo svg{width:19px;height:19px}
.ttl{flex:1;min-width:0}
.ttl b{display:block;font-size:16px;line-height:1.15}
.ttl small{color:var(--mute);font-size:12px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:6px 10px;border-radius:99px;background:var(--soft);color:var(--mute);white-space:nowrap}
.pill i{width:8px;height:8px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--acc-bg);color:var(--acc-d)}
.pill.busy{background:var(--info-bg);color:var(--info)}
.pill.busy i{animation:pulse 1s infinite}
.pill.offline,.pill.auth{background:var(--warn-bg);color:var(--warn)}
.pill.error{background:var(--bad-bg);color:var(--bad)}
@keyframes pulse{50%{opacity:.25}}
.ib{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--soft);color:var(--mute)}
.ib:hover{color:var(--ink)}

main{padding:16px 16px calc(92px + env(safe-area-inset-bottom));max-width:1000px;margin:0 auto}
nav.bar{position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--card);border-top:1px solid var(--line);display:flex;padding:4px 4px env(safe-area-inset-bottom)}
nav.bar .brand{display:none}
nav.bar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 6px;font-size:11px;font-weight:600;color:var(--mute);border-radius:12px;position:relative}
nav.bar button.on{color:var(--acc-d)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) nav.bar button.on{color:var(--acc)}}
:root[data-theme=dark] nav.bar button.on{color:var(--acc)}
nav.bar button .dot{position:absolute;top:6px;left:calc(50% + 6px);min-width:16px;height:16px;border-radius:99px;background:var(--bad);color:#fff;font-size:10px;display:grid;place-items:center;padding:0 4px}
@media(min-width:900px){
  .app{display:grid;grid-template-columns:230px 1fr}
  nav.bar{position:sticky;top:0;height:100dvh;flex-direction:column;justify-content:flex-start;gap:4px;border-top:0;border-right:1px solid var(--line);padding:20px 12px}
  nav.bar .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;padding:0 8px 18px}
  nav.bar button{flex:none;flex-direction:row;gap:12px;font-size:14px;padding:11px 12px;justify-content:flex-start}
  nav.bar button.on{background:var(--acc-bg)}
  nav.bar button .dot{position:static;margin-left:auto}
  main{padding:24px 28px 40px}
}

h2.h{font-size:20px;margin-bottom:2px}
.sub{color:var(--mute);font-size:13px}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1}
.hd{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--acc-d);color:#fff;font-weight:700;font-size:14px;padding:9px 14px;border-radius:12px}
.btn.alt{background:var(--soft);color:var(--ink)}
.btn.bad{background:var(--bad-bg);color:var(--bad)}
.btn.block{width:100%;justify-content:center;padding:13px}
.btn svg{width:17px;height:17px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.card h3{font-size:14px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,1fr)}
.g4{grid-template-columns:repeat(2,1fr)}
@media(min-width:700px){.g4{grid-template-columns:repeat(4,1fr)}.g2d{grid-template-columns:1fr 1fr}.ga{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
.kpi small{color:var(--mute);font-size:12px;font-weight:600;display:block}
.kpi b{display:block;font-size:19px;margin:3px 0 1px;letter-spacing:-.3px}
.kpi span{font-size:12px;color:var(--mute)}
.hero{background:linear-gradient(135deg,#047857,#0f766e);color:#fff;border-radius:22px;padding:20px;margin-bottom:14px;box-shadow:0 10px 30px rgba(4,120,87,.25)}
.hero small{opacity:.8;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.hero .big{font-size:34px;font-weight:800;letter-spacing:-1px;line-height:1.1;margin:4px 0 2px}
.hero .two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px;padding-top:14px;border-top:1px solid rgba(255,255,255,.25)}
.hero .two b{font-size:18px;display:block}
.hero button.edit{float:right;background:rgba(255,255,255,.18);color:#fff;font-size:12px;font-weight:700;padding:5px 10px;border-radius:99px}
.seg{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--soft);margin:6px 0 12px}
.seg i{display:block;height:100%}
.leg{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;font-size:13px}
.leg div{display:flex;align-items:center;gap:7px}
.leg em{width:10px;height:10px;border-radius:3px;flex:none}
.leg b{margin-left:auto;font-weight:700}
.item{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .m{flex:1;min-width:0}
.item .m b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .m small{color:var(--mute);font-size:12px}
.item .amt{font-weight:700;font-size:14px;white-space:nowrap}
.item.done .m b{text-decoration:line-through;color:var(--mute)}
.item.done .amt{color:var(--mute)}
.item.off{opacity:.5}
.chk{width:26px;height:26px;border-radius:9px;border:2px solid var(--line);display:grid;place-items:center;flex:none;color:#fff}
.chk svg{width:16px;height:16px;stroke-width:3;opacity:0}
.chk.on{background:var(--acc-d);border-color:var(--acc-d)}
.chk.on svg{opacity:1}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--soft);color:var(--mute)}
.tag.bad{background:var(--bad-bg);color:var(--bad)}
.tag.warn{background:var(--warn-bg);color:var(--warn)}
.tag.info{background:var(--info-bg);color:var(--info)}
.tag.ok{background:var(--acc-bg);color:var(--acc-d)}
.chips{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{padding:7px 14px;border-radius:99px;background:var(--soft);font-size:13px;font-weight:600;color:var(--mute);white-space:nowrap}
.chips button.on{background:var(--acc-d);color:#fff}
.empty{text-align:center;color:var(--mute);padding:26px 10px;font-size:14px}
.empty b{display:block;color:var(--ink);margin-bottom:4px}
.bars .b{margin:8px 0}
.bars .b div{display:flex;justify-content:space-between;font-size:13px;margin-bottom:3px}
.bars .b i{display:block;height:8px;border-radius:99px;background:var(--c-gasto)}
.stepper{display:flex;align-items:center;gap:6px}
.stepper b{min-width:120px;text-align:center;text-transform:capitalize;font-size:14px}
.progress{height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.progress i{display:block;height:100%;background:var(--acc);border-radius:99px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:var(--soft);border-radius:12px;padding:10px;margin:10px 0}
.stats small{display:block;color:var(--mute);font-size:11px;font-weight:600}
.stats b{font-size:14px}
.good{color:var(--acc-d)}.badc{color:var(--bad)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .good{color:var(--acc)}}
:root[data-theme=dark] .good{color:var(--acc)}
.note{font-size:12px;color:var(--mute);margin-top:6px}
a.lnk{color:var(--info);font-weight:600;font-size:12px;text-decoration:none}

/* reportes */
.tl{display:inline-block;width:14px;height:14px;border-radius:50%;flex:none;margin-top:3px}
.tl.big{width:46px;height:46px;margin:0;box-shadow:0 0 0 6px color-mix(in srgb,currentColor 18%,transparent)}
.tl.ok{background:#10b981;color:#10b981}.tl.warn{background:#f59e0b;color:#f59e0b}.tl.bad{background:#ef4444;color:#ef4444}
.card.sem.ok{border-color:#10b98155}.card.sem.warn{border-color:#f59e0b66}.card.sem.bad{border-color:#ef444466}
.hb{height:9px;border-radius:99px;background:var(--soft);margin:3px 0;overflow:hidden}.hb i{display:block;height:100%;border-radius:99px}
.tb{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}.tb th{color:var(--mute);text-align:right;font-weight:600;padding:6px 6px}.tb td{text-align:right;padding:7px 6px;border-top:1px solid var(--line);white-space:nowrap}.tb th:first-child,.tb td:first-child{text-align:left}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
canvas.mcard{width:100%;height:auto;aspect-ratio:4/5;border-radius:16px;display:block;box-shadow:var(--shadow)}
.printonly{display:none}
@media print{
  nav.bar,header.top,.noprint,#modal,#toast,#welcome,.fab{display:none!important}
  body{background:#fff;color:#000}.app{display:block}main{padding:0;max-width:none}
  .card,.kpi{box-shadow:none;break-inside:avoid}.printonly{display:block;margin-bottom:12px}
  details{display:block}details>*{display:block}
}
/* modal */
.ov{position:fixed;inset:0;background:rgba(6,16,11,.55);backdrop-filter:blur(3px);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:480px;border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));max-height:92dvh;overflow:auto;animation:up .18s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.6}}
@media(min-width:700px){.ov{align-items:center}.sheet{border-radius:22px}}
.sheet h3{font-size:18px;margin-bottom:12px;display:flex;align-items:center}
.f{margin-bottom:12px}
.f label{display:block;font-size:12px;font-weight:700;color:var(--mute);margin-bottom:4px}
.f input,.f select,.f textarea{width:100%;font-size:16px;padding:11px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);outline:0}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--acc)}
.f.ck{display:flex;align-items:center;gap:10px}
.f.ck input{width:20px;height:20px}
.f.ck label{margin:0;font-size:14px;color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.acts{display:flex;gap:8px;margin-top:6px}
.acts .btn{flex:1;justify-content:center;padding:12px}
.sec{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin:18px 0 8px}
.welcome{position:fixed;inset:0;z-index:60;background:var(--bg);overflow:auto;display:grid;place-items:center;padding:24px}
.welcome .box{max-width:420px;width:100%;text-align:center}
.welcome .logo{width:68px;height:68px;border-radius:20px;margin:0 auto 16px}
.welcome .logo svg{width:36px;height:36px}
.welcome h1{font-size:28px;letter-spacing:-.5px}
.welcome p{color:var(--mute);margin:8px 0 18px}
.welcome ul{list-style:none;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px 16px;margin-bottom:18px}
.welcome li{padding:9px 0;font-size:14px;display:flex;gap:10px;border-bottom:1px solid var(--line)}
.welcome li:last-child{border:0}
.welcome li svg{color:var(--acc-d);margin-top:1px}
.welcome .btn+.btn{margin-top:10px}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#12201a;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:80;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:90vw;text-align:center}
.hidden{display:none!important}
#lock{z-index:70}
.fab{position:fixed;right:16px;bottom:calc(78px + env(safe-area-inset-bottom));z-index:25;width:56px;height:56px;border-radius:50%;background:var(--acc-d);color:#fff;display:grid;place-items:center;box-shadow:0 8px 22px rgba(4,120,87,.45)}
.fab svg{width:26px;height:26px}
@media(min-width:900px){.fab{right:28px;bottom:28px}}
.btn.rec{background:var(--bad);color:#fff}
.dmex{display:flex;flex-wrap:wrap;margin-top:12px}
.dmex button{font-size:12px;padding:6px 10px;border-radius:99px;background:var(--soft);color:var(--mute);margin:0 6px 6px 0;text-align:left}
.dmmsg{background:var(--soft);border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:10px}
.devs{list-style:none;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:4px 14px;margin-bottom:16px}
.devs li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.devs li:last-child{border:0}
.devs li span{flex:1;min-width:0}
.devs small{display:block;color:var(--mute);font-size:12px}
.lockerr{background:var(--bad-bg);color:var(--bad);border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:12px;text-align:left}
#lock .btn{margin-top:10px}

</style>
</head>
<body>
<div class="app">
  <nav class="bar" id="nav"></nav>
  <div class="col">
    <header class="top">
      <div class="logo" id="logo"></div>
      <div class="ttl"><b>MiFlujo</b><small id="mes"></small></div>
      <button class="pill" id="sync" data-a="sync"><i></i><span>…</span></button>
      <button class="ib" data-a="settings" aria-label="Ajustes" id="gear"></button>
    </header>
    <main id="view"></main>
  </div>
</div>
<button class="fab" id="fab" data-a="dimelo" aria-label="Dímelo: registrar por texto o voz"></button>
<div id="modal"></div>
<div id="welcome" class="welcome hidden"></div>
<div id="lock" class="welcome hidden"></div>
<div id="toast" class="toast hidden"></div>

<script>
'use strict';
/* =====================================================================
   CONFIGURACIÓN PARA QUIEN DISTRIBUYE LA APP
   Pega aquí el "ID de cliente" OAuth de Google (ver README.md, paso 2).
   Si lo dejas vacío, cada persona puede pegar el suyo en la pantalla de inicio.
   ===================================================================== */
const CLIENT_ID = '';

/* ---- Licencias (opcional) ----
   Si dejas LICENSE_URL o LICENSE_PUBLIC_KEY vacíos, la app funciona sin pedir código (modo libre).
   Para vender: instala el servidor de licencias (carpeta licencias/, ver LEEME.md) y pega aquí sus dos datos. */
const LICENSE_URL = '';          // dirección de la "aplicación web" de Apps Script
const LICENSE_PUBLIC_KEY = '';   // clave pública que entrega licencias/generar-claves.html
const SUPPORT = '';              // cómo contactarte, ej. 'soporte@tudominio.com' (se muestra en la pantalla de activación)

const SCOPE = 'https://www.googleapis.com/auth/drive.file';   // solo archivos creados por esta app
const FILE_NAME = 'MiFlujo - Datos';
const LS = 'miflujo_v2';

/* ---------- Esquema = hojas del Excel (Google Sheets) ---------- */
// tipos: s texto · n número · b sí/no · d fecha · t hora
const TABS = {
  ingresos:    { sheet:'Ingresos',    cols:[['id','s'],['nombre','s'],['monto','n'],['frecuencia','s'],['fecha','d'],['hasta','d']] },
  pagos:       { sheet:'Pagos',       cols:[['id','s'],['nombre','s'],['monto','n'],['dia','n'],['categoria','s'],['activo','b'],['pagadoMes','s']] },
  gastos:      { sheet:'Gastos',      cols:[['id','s'],['fecha','d'],['concepto','s'],['monto','n'],['categoria','s']] },
  agenda:      { sheet:'Agenda',      cols:[['id','s'],['titulo','s'],['fecha','d'],['hora','t'],['tipo','s'],['prioridad','s'],['notas','s'],['hecho','b']] },
  inversiones: { sheet:'Inversiones', cols:[['id','s'],['nombre','s'],['monto','n'],['tasaEA','n'],['meses','n'],['inicio','d']] },
  creditos:    { sheet:'Creditos',    cols:[['id','s'],['nombre','s'],['saldo','n'],['cuota','n'],['tasaMensual','n'],['dia','n'],['pagadoMes','s']] },
};
const CONFIG_SHEET = 'Config';
const ALL = ['config', ...Object.keys(TABS)];
const CATS = ['Hogar','Alimentación','Transporte','Suscripciones','Educación','Salud','Ocio','Otros'];
const MONEDAS = ['COP','USD','EUR','MXN','ARS','PEN','CLP','BRL','UYU','BOB','GTQ','CRC','DOP','PAB'];
const LOCALE = { COP:'es-CO', USD:'es-US', EUR:'es-ES', MXN:'es-MX', ARS:'es-AR', PEN:'es-PE', CLP:'es-CL', BRL:'pt-BR', UYU:'es-UY', BOB:'es-BO', GTQ:'es-GT', CRC:'es-CR', DOP:'es-DO', PAB:'es-PA' };
const FREQ = ['Todos los meses','Solo una vez'];

/* ---------- Estado ---------- */
const EMPTY = () => ({ config:{ ingreso:0, moneda:'COP' }, ingresos:[], pagos:[], gastos:[], agenda:[], inversiones:[], creditos:[] });
let D = EMPTY();
let M = { mode:'', sheetId:'', dirty:[], user:'', lastPull:0 };   // mode: '' | 'local' | 'drive'
let view = 'inicio', fPago = 'all', fAgenda = 'open', gMes = '';
let syncState = 'local', ver = {}, syncing = false, flushTimer = null;

function load(){
  try{
    const s = JSON.parse(localStorage.getItem(LS) || 'null');
    if(s){ D = Object.assign(EMPTY(), s.D); D.config = Object.assign({ ingreso:0, moneda:'COP' }, D.config); M = Object.assign(M, s.M); }
  }catch(e){}
}
function save(){ try{ localStorage.setItem(LS, JSON.stringify({ D, M })); }catch(e){} }
function markDirty(n){ ver[n] = (ver[n] || 0) + 1; if(!M.dirty.includes(n)) M.dirty.push(n); }
function migrateIngreso(){   // versión anterior: un solo "ingreso mensual" -> ahora es el primer ingreso de la lista
  if(D.config.ingreso > 0 && !D.ingresos.length){
    D.ingresos.push({ id:uid(), nombre:'Ingreso principal', monto:D.config.ingreso, frecuencia:FREQ[0], fecha:'', hasta:'' });
    D.config.ingreso = 0; markDirty('ingresos'); markDirty('config'); save();
  }
}

function obligations(){
  const m = mk(), out = [];
  D.pagos.filter(p => p.activo).forEach(p => out.push({ t:'pagos', id:p.id, nombre:p.nombre, monto:p.monto, dia:p.dia, paid:p.pagadoMes === m, cat:p.categoria, due:dueIn(p.dia) }));
  D.creditos.filter(c => c.saldo > 0 && c.cuota > 0).forEach(c => out.push({ t:'creditos', id:c.id, nombre:c.nombre, monto:c.cuota, dia:c.dia, paid:c.pagadoMes === m, cat:'Cuota de crédito', due:dueIn(c.dia) }));
  return out.sort((a,b) => a.due - b.due);
}
/* Ingresos de un mes: los recurrentes (desde su fecha de inicio hasta su fecha de fin, si hay) + los de "solo una vez" de ese mes */
function ingresoMes(m){ return D.ingresos.reduce((s,i) => s + ingresoMes2(i, m), 0); }
function ingresoMes2(i, m){   // aporte de un solo ingreso a un mes
  const im = (i.fecha || '').slice(0,7), hm = (i.hasta || '').slice(0,7);
  if(i.frecuencia === 'Solo una vez') return im === m ? i.monto : 0;
  return (!im || im <= m) && (!hm || m <= hm) ? i.monto : 0;
}
function monthStats(m){
  const sum = (a, f) => a.reduce((s,x) => s + f(x), 0);
  const fijos = sum(D.pagos.filter(p => p.activo), p => p.monto);                       // se asumen iguales cada mes
  const cuotas = sum(D.creditos.filter(c => c.saldo > 0 && c.cuota > 0), c => c.cuota);
  const gl = D.gastos.filter(g => (g.fecha || '').startsWith(m)), cats = {};
  gl.forEach(g => cats[g.categoria] = (cats[g.categoria] || 0) + g.monto);
  const gastos = sum(gl, g => g.monto), ing = ingresoMes(m), salida = fijos + cuotas + gastos, libre = ing - salida;
  return { m, ing, fijos, cuotas, gastos, salida, libre, cats:Object.entries(cats).sort((a,b) => b[1] - a[1]), rate:ing > 0 ? libre / ing : null };
}
function monthsList(){
  const cur = mk(); let first = cur;
  const upd = s => { const x = (s || '').slice(0,7); if(x && x < first) first = x; };
  // el historial empieza en el primer ingreso registrado (sin ingresos no se puede medir el flujo)
  if(D.ingresos.length && D.ingresos.every(i => i.fecha)) D.ingresos.forEach(i => upd(i.fecha));
  else D.gastos.forEach(g => upd(g.fecha));
  const out = []; let m = first; while(m <= cur){ out.push(m); m = addMes(m, 1); }
  return out.slice(-12);
}
function totals(){
  const m = mk(), ob = obligations(), S = monthStats(m);
  const pend = ob.filter(o => !o.paid);
  return Object.assign({ ob, porPagar:pend.reduce((s,x) => s + x.monto, 0), nPend:pend.length }, S);
}

/* ---------- Semáforo, recomendaciones y proyecciones (reglas fijas, sin servidor) ---------- */
const LV = { ok:0, warn:1, bad:2 };
function health(m){
  const S = monthStats(m), cur = mk(), isCur = m === cur, items = [], now = new Date();
  const top = S.cats[0];
  // 1. Flujo del mes
  if(S.ing <= 0) items.push({ lv:'warn', name:'Flujo del mes', val:'Sin ingresos', tip:'Registra tus ingresos para poder evaluar tu mes.' });
  else if(S.libre < 0) items.push({ lv:'bad', name:'Flujo del mes', val:'Déficit de ' + fmt(-S.libre),
    tip:`Estás gastando ${fmt(-S.libre)} más de lo que ingresa. ${top ? `Tu mayor gasto variable es ${top[0]} (${fmt(top[1])}): ahí está el recorte más fácil.` : 'Revisa si puedes pausar algún pago o sumar un ingreso extra.'}` });
  else if(S.rate < 0.15) items.push({ lv:'warn', name:'Flujo del mes', val:'Te queda ' + pct(S.rate), tip:`Tu margen es estrecho (${pct(S.rate)} de tus ingresos). Un imprevisto te pondría en rojo; apunta a dejar entre 15% y 20% libre.` });
  else items.push({ lv:'ok', name:'Flujo del mes', val:'Te queda ' + pct(S.rate), tip:`Te quedan ${fmt(S.libre)} libres (${pct(S.rate)} de tus ingresos). ¡Buen margen!` });
  // 2. Peso de las deudas
  if(S.cuotas > 0 && S.ing > 0){
    const r = S.cuotas / S.ing, lv = r > 0.35 ? 'bad' : r > 0.2 ? 'warn' : 'ok';
    items.push({ lv, name:'Peso de tus deudas', val:pct(r) + ' del ingreso', tip: lv === 'ok' ? 'Tus cuotas están en un nivel sano (menos del 20% de tus ingresos).' : lv === 'warn' ? 'Tus cuotas pesan entre 20% y 35% de tus ingresos. Evita nuevas deudas y abona extra a la de mayor interés.' : 'Tus cuotas superan el 35% de tus ingresos: es una carga alta. Prioriza abonar a capital o renegociar plazos y tasas.' });
  }else if(S.cuotas === 0) items.push({ lv:'ok', name:'Peso de tus deudas', val:'Sin cuotas', tip:'No tienes cuotas de créditos este mes.' });
  // 3. Gasto variable frente a tu promedio
  const prev = monthsList().filter(x => x < m).map(x => monthStats(x).gastos), av = avg(prev);
  if(prev.length && av > 0 && (!isCur || now.getDate() >= 8)){
    const frac = isCur ? now.getDate() / dim(now.getFullYear(), now.getMonth()) : 1, ratio = S.gastos / (av * frac);
    const lv = ratio > 1.4 ? 'bad' : ratio > 1.15 ? 'warn' : 'ok';
    items.push({ lv, name:'Gastos variables vs tu promedio', val:(ratio >= 1 ? '+' : '') + Math.round((ratio - 1) * 100) + '%',
      tip: lv === 'ok' ? `Vas en línea con tu promedio de ${fmt(av)} al mes.` : `Vas ${Math.round((ratio - 1) * 100)}% por encima de tu promedio (${fmt(av)} al mes).${top ? ` Mira primero ${top[0]}.` : ''}` });
  }
  // 4. Colchón (solo mes actual)
  if(isCur && S.salida > 0){
    const inv = D.inversiones.reduce((s,i) => s + i.monto, 0), meses = inv / S.salida;
    items.push({ lv:meses >= 3 ? 'ok' : 'warn', name:'Colchón de ahorro', val:meses.toFixed(1) + ' meses',
      tip: meses >= 3 ? `Tus ahorros e inversiones cubren ${meses.toFixed(1)} meses de gastos. Excelente colchón.` : `Tus ahorros cubren ${meses.toFixed(1)} meses de gastos. La meta habitual es 3 a 6 meses.` });
  }
  // Rojo solo cuando hay déficit; amarillo si algo está regular o en alerta; verde si todo va bien
  const level = items[0].lv === 'bad' ? 'bad' : items.every(x => x.lv === 'ok') ? 'ok' : 'warn';
  const title = { ok:'Vas muy bien', warn:'Vas regular: hay margen para mejorar', bad:'Alerta: estás en déficit' }[level];
  return { level, title, items, S };
}
function insights(m){
  const S = monthStats(m), out = [], hist = monthsList().map(monthStats);
  const top = S.cats[0], vtot = S.gastos;
  if(top && vtot > 0) out.push(`Tu mayor gasto variable es <b>${esc(top[0])}</b>: ${pct(top[1] / vtot)} de lo que gastas fuera de tus pagos fijos.`);
  if(hist.length >= 2){
    const worst = hist.reduce((a,b) => b.salida > a.salida ? b : a), best = hist.reduce((a,b) => b.salida < a.salida ? b : a);
    if(worst.m !== best.m) out.push(`El mes en que más gastaste fue <b>${cap(mesLabel(worst.m))}</b> (${fmt(worst.salida)}); el más económico, <b>${cap(mesLabel(best.m))}</b> (${fmt(best.salida)}).`);
  }
  if(S.libre < 0 && S.ing > 0) out.push(`Para volver al equilibrio necesitas recortar ${fmt(-S.libre)} al mes o sumar ese valor en ingresos.`);
  if(S.libre > 0){

    if(cr && cr.tasaMensual > 0) out.push(`Si te sobra dinero, abona primero a <b>${esc(cr.nombre)}</b>: tiene el interés más alto (${cr.tasaMensual}% mensual). Destinando ${fmt(S.libre * 0.5)} al mes lo acortas bastante.`);
    else if(!D.inversiones.length) out.push(`Te sobran ${fmt(S.libre)}: considera separar una parte cada mes en un ahorro o CDT para armar tu colchón.`);
  }
  if(S.gastos > 0) out.push(`Si reduces tus gastos variables un 10%, ahorrarías cerca de <b>${fmt(S.gastos * 0.1 * 12)}</b> al año.`);
  D.creditos.filter(c => c.saldo > 0 && c.cuota > 0 && !isFinite(credCalc(c).n)).forEach(c => out.push(`La cuota de <b>${esc(c.nombre)}</b> no cubre sus intereses: la deuda crece cada mes. Sube la cuota o renegocia.`));

  if(!D.ingresos.length) out.unshift('Aún no has registrado ingresos: sin ellos no se puede calcular tu flujo de caja.');
  return out.slice(0, 6);
}
function invValueAt(i, k){   // valor del producto dentro de k meses (después del vencimiento queda quieto)
  const f = new Date(); f.setMonth(f.getMonth() + k);
  const yrs = Math.max(0, Math.min(i.meses / 12, (f - parseD(i.inicio)) / (365.25 * 864e5)));
  return i.monto * Math.pow(1 + i.tasaEA / 100, yrs);
}
function project(n){
  const cur = mk(), hist = monthsList().filter(x => x < cur).map(x => monthStats(x).gastos);
  const gVar = hist.length ? avg(hist.slice(-3)) : monthStats(cur).gastos;
  const fijos = D.pagos.filter(p => p.activo).reduce((s,p) => s + p.monto, 0);
  const debts = D.creditos.filter(c => c.saldo > 0 && c.cuota > 0).map(c => ({ s:c.saldo, r:c.tasaMensual / 100, q:c.cuota }));
  const ahorro0 = D.inversiones.reduce((s,i) => s + invValueAt(i, 0), 0);
  const rows = [{ m:cur, libre:0, ahorro:ahorro0, deuda:debts.reduce((s,d) => s + d.s, 0), caja:0, pat:ahorro0 - debts.reduce((s,d) => s + d.s, 0) }];
  let caja = 0, firstDef = null, freeAt = null;
  for(let k = 1; k <= n; k++){
    let cuotas = 0;
    debts.forEach(d => { if(d.s > 0){ const it = d.s * d.r, pay = Math.min(d.q, d.s + it); d.s = d.s + it - pay; cuotas += pay; if(d.s < 0.5) d.s = 0; } });
    const m = addMes(cur, k), libre = ingresoMes(m) - fijos - cuotas - gVar;
    caja += libre;
    const deuda = debts.reduce((s,d) => s + d.s, 0), ahorro = D.inversiones.reduce((s,i) => s + invValueAt(i, k), 0);
    if(libre < 0 && !firstDef) firstDef = m;
    if(deuda === 0 && debts.length && freeAt === null) freeAt = m;
    rows.push({ m, libre, ahorro, deuda, caja, pat:ahorro + caja - deuda });

function invCalc(i){
  const P = i.monto, r = i.tasaEA / 100, yrs = i.meses / 12;
  const start = parseD(i.inicio), end = new Date(start); end.setMonth(end.getMonth() + i.meses);
  const now = new Date(); now.setHours(0,0,0,0);
  const el = Math.max(0, Math.min(yrs, (now - start) / (365.25 * 864e5)));
  const gainTotal = P * (Math.pow(1 + r, yrs) - 1);
  return { gainTotal, gainNow:P * (Math.pow(1 + r, el) - 1), total:P + gainTotal, end, daysLeft:dayDiff(end, now), pct:yrs > 0 ? Math.min(100, el / yrs * 100) : 100 };
}
function credCalc(c){

    if(r > 0){ if(c.cuota > c.saldo * r) n = -Math.log(1 - r * c.saldo / c.cuota) / Math.log(1 + r); }
    else n = c.saldo / c.cuota;

function upcoming(days){

  D.agenda.filter(a => !a.hecho && a.fecha).forEach(a => {

}

function gcal(a){
  const [hh, mm] = (a.hora || '09:00').split(':').map(Number);
  const s = new Date(parseD(a.fecha)); s.setHours(hh, mm);
  const e = new Date(s); e.setHours(hh + 1);
  const f = d => iso(d).replace(/-/g,'') + 'T' + pad(d.getHours()) + pad(d.getMinutes()) + '00';
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text=' + encodeURIComponent(a.titulo) + '&dates=' + f(s) + '/' + f(e) + '&details=' + encodeURIComponent(a.notas || '');
}

let rHor = 6;

function lineChart(series, labels){
  const W = 600, H = 220, pl = 8, pr = 8, pt = 12, pb = 24, all = series.flatMap(s => s.v);
  let lo = Math.min(0, ...all), hi = Math.max(0, ...all); if(hi === lo) hi = lo + 1;
  const x = i => pl + i * (W - pl - pr) / Math.max(1, labels.length - 1), y = v => pt + (hi - v) / (hi - lo) * (H - pt - pb);
  const lines = series.map(s => `<polyline fill="none" stroke="${s.c}" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" points="${s.v.map((v,i) => x(i).toFixed(1) + ',' + y(v).toFixed(1)).join(' ')}"/>`).join('');
  const ticks = [0, Math.floor((labels.length - 1) / 2), labels.length - 1].filter((v,i,a) => a.indexOf(v) === i);
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img" aria-label="Proyección">
    <line x1="${pl}" x2="${W - pr}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line)" stroke-width="1.5" stroke-dasharray="4 4"/>${lines}
    ${ticks.map(i => `<text x="${x(i)}" y="${H - 6}" font-size="12" fill="var(--mute)" text-anchor="${i === 0 ? 'start' : i === labels.length - 1 ? 'end' : 'middle'}">${labels[i]}</text>`).join('')}</svg>`;
}

/* ---------- Tarjeta compartible (canvas 1080×1350) ---------- */

  const val = v => hide ? (S.ing > 0 ? Math.round(v / S.ing * 100) + '%' : '—') : fmt(v), T = (t, x, y, px, w, col, al) => { fit(c, t, W - 144 - (al === 'right' ? 0 : 0), px, w); c.fillStyle = col; c.textAlign = al || 'left'; c.fillText(t, x, y); };

  if(!hide && S.rate != null) T(`${S.rate >= 0 ? '' : '−'}${Math.abs(Math.round(S.rate * 100))}% de tus ingresos`, 72, 656, 34, 600, pal[2]);
  const tot = Math.max(S.ing, S.salida) || 1, segs = [[S.fijos, '#fbbf24'], [S.cuotas, '#fb7185'], [S.gastos, '#60a5fa'], [Math.max(0, S.libre), '#34d399']];

function fieldHTML(f, v){
  const id = 'f_' + f.k, req = f.opt ? '' : 'required';
  if(f.t === 'check') return `<div class="f ck"><input type="checkbox" id="${id}" ${v ? 'checked' : ''}><label for="${id}">${f.l}</label></div>`;
  let inp;
  if(f.t === 'select') inp = `<select id="${id}">${f.o.map(o => `<option ${o === v ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select>`;
  else if(f.t === 'textarea') inp = `<textarea id="${id}" rows="2" placeholder="${esc(f.ph || '')}">${esc(v)}</textarea>`;
  else if(f.t === 'number') inp = `<input id="${id}" type="number" inputmode="decimal" step="any" ${f.min != null ? `min="${f.min}" max="${f.max}"` : 'min="0"'} value="${v === undefined || v === '' ? '' : esc(v)}" ${req}>`;
  else inp = `<input id="${id}" type="${f.t}" value="${esc(v)}" placeholder="${esc(f.ph || '')}" ${req} ${f.t === 'text' ? 'autocomplete="off"' : ''}>`;
  return `<div class="f"><label for="${id}">${f.l}</label>${inp}</div>`;
}
function openForm(tab, id, pre, note){
  const F = FORMS[tab], cur = id ? D[tab].find(x => x.id === id) : null, v = Object.assign({}, cur || F.def(), pre || {});
  let html = '', buf = [];
  const flush = () => { if(buf.length){ html += `<div class="two">${buf.join('')}</div>`; buf = []; } };
  F.fields.forEach(f => { const h = fieldHTML(f, v[f.k]); if(f.w){ buf.push(h); if(buf.length === 2) flush(); } else { flush(); html += h; } });
  flush();
  $('#modal').innerHTML = `<div class="ov" data-a="close-bg"><form class="sheet" id="f" data-t="${tab}" data-id="${id || ''}">
    <h3>${cur ? 'Editar' : 'Nuevo'} · ${F.title}<span class="sp"></span><button type="button" class="ib" data-a="close" aria-label="Cerrar">${ic('x')}</button></h3>${note ? `<div class="dmmsg">${esc(note)}</div>` : ''}${html}
    <div class="acts">${cur ? '<button type="button" class="btn bad" data-a="del">Eliminar</button>' : ''}<button class="btn" type="submit">Guardar</button></div></form></div>`;
  const first = $('#f input[type=text]'); if(first && !cur) setTimeout(() => first.focus(), 60);
}
function saveForm(form){
  const tab = form.dataset.t, id = form.dataset.id, F = FORMS[tab], vals = {};
  F.fields.forEach(f => {
    const el = $('#f_' + f.k);
    vals[f.k] = f.t === 'check' ? el.checked : f.t === 'number' ? num(el.value) : el.value.trim();
  });
  if(vals.dia != null) vals.dia = Math.min(31, Math.max(1, Math.round(vals.dia)));
  if(id){ Object.assign(D[tab].find(x => x.id === id), vals); }
  else D[tab].push(Object.assign({ id:uid() }, F.def(), vals));
  closeModal(); touch(tab);
}

function touch(name){
  ver[name] = (ver[name] || 0) + 1;
  if(!M.dirty.includes(name)) M.dirty.push(name);
  save(); render();
  if(M.mode === 'drive'){ clearTimeout(flushTimer); flushTimer = setTimeout(flush, 500); }
}
function togglePay(tab, id){
  const it = D[tab].find(x => x.id === id), m = mk(); if(!it) return;
  it.pagadoMes = it.pagadoMes === m ? '' : m; touch(tab);
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if(!el) return;
  const a = el.dataset.a, t = el.dataset.t, id = el.dataset.id, v = el.dataset.v;
  if(a === 'close-bg'){ if(e.target === el) closeModal(); return; }
  if(e.target.closest('a.lnk,a.btn') && !el.matches('a')) return;
  switch(a){
    case 'tab': view = v; render(); window.scrollTo(0,0); break;
    case 'add': openForm(t); break;
    case 'edit': openForm(t, id); break;
    case 'pay': togglePay(t, id); break;
    case 'done': { const x = D.agenda.find(z => z.id === id); if(x){ x.hecho = !x.hecho; touch('agenda'); } break; }
    case 'fpago': fPago = v; render(); break;
    case 'rh': rHor = Number(v); render(); break;
    case 'csv': exportCSV(); break;
    case 'print': window.print(); break;
    case 'card-dl': cardDownload(el.dataset.m); break;
    case 'card-share': cardShare(el.dataset.m); break;
    case 'fagenda': fAgenda = v; render(); break;
    case 'gm': { const [y,m] = (gMes || mk()).split('-').map(Number); gMes = mk(new Date(y, m - 1 + Number(v), 1)); render(); break; }
    case 'settings': openSettings(); break;
    case 'close': closeModal(); break;
    case 'del': { const f = $('#f'); if(confirm('¿Eliminar este registro?')){ D[f.dataset.t] = D[f.dataset.t].filter(x => x.id !== f.dataset.id); closeModal(); touch(f.dataset.t); } break; }
    case 'sync': onSyncClick(); break;
    case 'connect': case 'w-connect': connect(); break;
    case 'w-local': M.mode = 'local'; save(); $('#welcome').classList.add('hidden'); setSync('local'); break;
    case 'w-cid': { const x = $('#cid').value.trim(); if(x){ localStorage.setItem('miflujo_cid', x); showWelcome(); } break; }
    case 'pull': closeModal(); pullNow(true); break;
    case 'disconnect': disconnect(); break;
    case 'notif': Notification.requestPermission().then(() => { openSettings(); checkNotify(true); }); break;
    case 'export': case 'lic-export': exportData(); break;
    case 'lic-retry': licenseGate().then(ok => { if(ok) unlock(false); }); break;
    case 'lic-free': licFree(v); break;
    case 'lic-release': licRelease(); break;
    case 'dimelo': dimeloOpen(); break;
    case 'dm-mic': dmMic(); break;
    case 'dm-ex': { const b = $('#dm-t'); if(b){ b.value = v; b.focus(); } break; }
    case 'dm-paid': { const it = D[t].find(x => x.id === id); if(it && it.pagadoMes !== mk()){ it.pagadoMes = mk(); touch(t); } closeModal(); toast('Marcado como pagado ✓'); break; }
    case 'reset': if(confirm('Se borrarán los datos guardados en ESTE equipo. Tu archivo de Google Drive no se toca. ¿Continuar?')){ localStorage.removeItem(LS); location.reload(); } break;
  }
});

function exportData(){
  const blob = new Blob([JSON.stringify({ app:'miflujo', version:2, D }, null, 2)], { type:'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `miflujo_${today()}.json`; a.click(); URL.revokeObjectURL(a.href);
}
function importData(inp){
  const f = inp.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const j = JSON.parse(r.result), d = j.D || fromV1(j);
      if(!d) throw 0;
      if(!confirm('Esto reemplaza los datos actuales por los del archivo. ¿Continuar?')) return;
      D = Object.assign(EMPTY(), d); D.config = Object.assign({ ingreso:0, moneda:'COP' }, D.config); migrateIngreso();
      ALL.forEach(n => touch(n)); closeModal(); toast('Copia cargada');
    }catch(e){ toast('El archivo no es una copia válida de MiFlujo'); }
  };
  r.readAsText(f);
}
function fromV1(j){   // formato de la versión anterior (miflujo_data_v1)
  if(!j || !('monthlyIncome' in j)) return null;
  const m = mk(), d = EMPTY(); d.config.ingreso = num(j.monthlyIncome);
  (j.payments || []).forEach(p => d.pagos.push({ id:uid(), nombre:p.name, monto:num(p.amount), dia:num(p.day) || 1, categoria:p.category || 'Otros', activo:p.recurring !== false, pagadoMes:p.paid ? m : '' }));
  (j.reminders || []).forEach(r => d.agenda.push({ id:uid(), titulo:r.title, fecha:r.date, hora:r.time || '', tipo:r.type || 'Personal', prioridad:r.priority || 'Media', notas:r.notes || '', hecho:!!r.completed }));
  (j.investments || []).forEach(i => d.inversiones.push({ id:uid(), nombre:i.name, monto:num(i.amount), tasaEA:num(i.rate), meses:num(i.months), inicio:i.start }));
  (j.debts || []).forEach(c => d.creditos.push({ id:uid(), nombre:c.name, saldo:num(c.amount), cuota:num(c.payment), tasaMensual:num(c.rate), dia:num(c.day) || 1, pagadoMes:'' }));
  return d;
}

/* ---------- Google: autenticación ---------- */
const getCid = () => (CLIENT_ID || localStorage.getItem('miflujo_cid') || '').trim();
let tokenClient, token = '', tokenExp = 0, tokenP = null, gisP = null;
function loadGIS(){
  if(window.google && google.accounts && google.accounts.oauth2) return Promise.resolve();
  return gisP || (gisP = new Promise((res, rej) => {
    const s = document.createElement('script'); s.src = 'https://accounts.google.com/gsi/client';
    s.onload = () => res(); s.onerror = () => { gisP = null; rej(Object.assign(new Error('No se pudo cargar Google (¿sin internet?)'), { offline:true })); };
    document.head.appendChild(s);
  }));
}
function getToken(interactive){
  if(token && Date.now() < tokenExp - 30000) return Promise.resolve(token);
  if(tokenP) return tokenP;
  tokenP = new Promise((res, rej) => {
    const timer = setTimeout(() => rej(Object.assign(new Error('auth-timeout'), { status:401 })), interactive ? 120000 : 8000);
    const done = (fn, v) => { clearTimeout(timer); tokenP = null; fn(v); };
    if(!tokenClient) tokenClient = google.accounts.oauth2.initTokenClient({ client_id:getCid(), scope:SCOPE, callback:() => {} });
    tokenClient.callback = r => {
      if(r.error) return done(rej, Object.assign(new Error(r.error), { status:401 }));
      token = r.access_token; tokenExp = Date.now() + (r.expires_in || 3600) * 1000; done(res, token);
    };
    tokenClient.error_callback = er => done(rej, Object.assign(new Error((er && er.type) || 'auth'), { status:401 }));
    tokenClient.requestAccessToken({ prompt:interactive ? '' : 'none' });
  });
  return tokenP;
}
async function g(url, opt = {}, retry = true){
  const t = await getToken(false);
  const r = await fetch(url, Object.assign({}, opt, { headers:Object.assign({ Authorization:'Bearer ' + t, 'Content-Type':'application/json' }, opt.headers) }));
  if(r.status === 401 && retry){ token = ''; return g(url, opt, false); }
  if(!r.ok){ let m = ''; try{ m = (await r.json()).error.message; }catch(e){} throw Object.assign(new Error(m || ('HTTP ' + r.status)), { status:r.status }); }
  return r.status === 204 ? null : r.json();
}

/* ---------- Google: Drive / Sheets ---------- */
const SH = 'https://sheets.googleapis.com/v4/spreadsheets';
const sheetOf = n => n === 'config' ? CONFIG_SHEET : TABS[n].sheet;
const headerOf = n => n === 'config' ? ['clave','valor'] : TABS[n].cols.map(c => c[0]);

async function findSheet(){
  const q = encodeURIComponent(`name='${FILE_NAME}' and mimeType='application/vnd.google-apps.spreadsheet' and trashed=false`);
  const r = await g(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name)&orderBy=createdTime&pageSize=5`);
  return r.files && r.files[0] ? r.files[0].id : '';
}
async function createSheet(){
  const r = await g(SH, { method:'POST', body:JSON.stringify({
    properties:{ title:FILE_NAME, locale:'es_CO' },
    sheets:ALL.map(n => ({ properties:{ title:sheetOf(n), gridProperties:{ frozenRowCount:1 } } })) }) });
  await g(`${SH}/${r.spreadsheetId}/values:batchUpdate`, { method:'POST', body:JSON.stringify({
    valueInputOption:'RAW', data:ALL.map(n => ({ range:`${sheetOf(n)}!A1`, values:[headerOf(n)] })) }) });
  await g(`${SH}/${r.spreadsheetId}:batchUpdate`, { method:'POST', body:JSON.stringify({ requests:r.sheets.map(s => ({
    repeatCell:{ range:{ sheetId:s.properties.sheetId, startRowIndex:0, endRowIndex:1 }, cell:{ userEnteredFormat:{ textFormat:{ bold:true }, backgroundColor:{ red:.89, green:.96, blue:.92 } } }, fields:'userEnteredFormat(textFormat,backgroundColor)' } })) }) });
  return r.spreadsheetId;
}
async function ensureTabs(){   // por si alguien borró una hoja a mano
  const r = await g(`${SH}/${M.sheetId}?fields=sheets.properties.title`);
  const have = (r.sheets || []).map(s => s.properties.title), miss = ALL.filter(n => !have.includes(sheetOf(n)));
  if(!miss.length) return;
  await g(`${SH}/${M.sheetId}:batchUpdate`, { method:'POST', body:JSON.stringify({ requests:miss.map(n => ({ addSheet:{ properties:{ title:sheetOf(n), gridProperties:{ frozenRowCount:1 } } } })) }) });
  await g(`${SH}/${M.sheetId}/values:batchUpdate`, { method:'POST', body:JSON.stringify({ valueInputOption:'RAW', data:miss.map(n => ({ range:`${sheetOf(n)}!A1`, values:[headerOf(n)] })) }) });
  miss.forEach(n => { if(!M.dirty.includes(n)) M.dirty.push(n); });
}
function toRows(n){
  if(n === 'config') return [['moneda', D.config.moneda]];
  return D[n].map(o => TABS[n].cols.map(([k,t]) => t === 'b' ? !!o[k] : t === 'n' ? (o[k] ?? 0) : (o[k] ?? '')));
}
async function pushTab(n){
  const rows = toRows(n), s = sheetOf(n);
  if(rows.length) await g(`${SH}/${M.sheetId}/values/${encodeURIComponent(s + '!A2')}?valueInputOption=RAW`, { method:'PUT', body:JSON.stringify({ values:rows }) });
  await g(`${SH}/${M.sheetId}/values/${encodeURIComponent(`${s}!A${rows.length + 2}:Z`)}:clear`, { method:'POST', body:'{}' });
}
async function flush(){
  if(M.mode !== 'drive' || !M.sheetId) return;
  if(syncing) return; syncing = true; setSync('busy');
  try{
    while(M.dirty.length){
      const n = M.dirty[0], v = ver[n] || 0;
      await pushTab(n);
      if((ver[n] || 0) === v) M.dirty.shift(); else M.dirty.push(M.dirty.shift());
      save();
    }
    M.lastPull = M.lastPull || Date.now(); setSync('ok');
  }catch(e){ syncErr(e); }
  finally{ syncing = false; }
}
function syncErr(e){
  console.warn('sync', e);
  if(!navigator.onLine || e.offline || e instanceof TypeError) setSync('offline');
  else if(e.status === 401) setSync('auth');
  else { setSync('error'); toast('No se pudo sincronizar: ' + e.message); }
}
function cell(v, t){
  if(v === undefined || v === null) return t === 'n' ? 0 : t === 'b' ? false : '';
  if(t === 'n') return num(v);
  if(t === 'b') return v === true || ['true','si','sí','1','x'].includes(String(v).trim().toLowerCase());
  if(t === 'd' && typeof v === 'number') return iso(new Date(Math.round((v - 25569) * 864e5 + 12 * 36e5)));
  if(t === 't' && typeof v === 'number'){ const mi = Math.round(v * 1440); return pad(Math.floor(mi / 60) % 24) + ':' + pad(mi % 60); }
  return String(v);
}
async function pullAll(){
  await ensureTabs();
  const qs = ALL.map(n => 'ranges=' + encodeURIComponent(`${sheetOf(n)}!A2:Z`)).join('&');
  const r = await g(`${SH}/${M.sheetId}/values:batchGet?valueRenderOption=UNFORMATTED_VALUE&${qs}`);
  ALL.forEach((n, i) => {
    if(M.dirty.includes(n)) return;                  // cambios locales pendientes ganan
    const rows = ((r.valueRanges || [])[i] || {}).values || [];
    if(n === 'config'){
      const c = {}; rows.forEach(x => { if(x[0]) c[String(x[0])] = x[1]; });
      D.config = { ingreso:num(c.ingreso), moneda:MONEDAS.includes(c.moneda) ? c.moneda : (D.config.moneda || 'COP') }; return;
    }
    const cols = TABS[n].cols, out = []; let fixed = false;
    rows.forEach(x => {
      if(!x.some(v => v !== '' && v != null)) return;
      const o = {}; cols.forEach(([k,t], j) => o[k] = cell(x[j], t));
      if(!o.id){ o.id = uid(); fixed = true; }       // filas escritas a mano en el Excel
      out.push(o);
    });
    D[n] = out; if(fixed && !M.dirty.includes(n)) M.dirty.push(n);
  });
  migrateIngreso(); M.lastPull = Date.now(); save();
}
async function fetchUser(){
  try{ const r = await g('https://www.googleapis.com/drive/v3/about?fields=user(emailAddress)'); M.user = (r.user && r.user.emailAddress) || ''; save(); }catch(e){}
}
async function bootDrive(){
  setSync(navigator.onLine ? 'busy' : 'offline');
  try{
    await loadGIS(); await getToken(false);
    await pullAll(); render(); await flush(); fetchUser();
  }catch(e){ syncErr(e); }
}
async function pullNow(manual){
  if(M.mode !== 'drive') return;
  setSync('busy');
  try{ await loadGIS(); await getToken(false); await pullAll(); render(); await flush(); if(manual) toast('Datos actualizados desde tu Drive'); }
  catch(e){ syncErr(e); }
}
async function connect(){
  const cid = getCid(); if(!cid){ toast('Falta el ID de cliente de Google'); return; }
  if(!/^https?:/.test(location.protocol)){ toast('Para conectar con Google abre la app desde su dirección web (https)'); return; }
  setSync('busy');
  try{
    await loadGIS(); await getToken(true);
    const had = D.pagos.length + D.gastos.length + D.agenda.length + D.inversiones.length + D.creditos.length + D.ingresos.length > 0;
    let id = M.sheetId || await findSheet();
    if(id){
      if(had && M.mode !== 'drive' && !confirm('Encontré tu archivo “' + FILE_NAME + '” en Drive.\n\nAceptar: usar los datos de Drive (se reemplazan los de este equipo).\nCancelar: no conectar por ahora.')){ setSync('local'); return; }
      M.sheetId = id; M.mode = 'drive'; M.dirty = []; await pullAll();
    }else{
      M.sheetId = await createSheet(); M.mode = 'drive'; M.dirty = ALL.slice();
    }
    M.mode = 'drive'; save(); $('#welcome').classList.add('hidden'); closeModal(); render();
    await flush(); fetchUser(); toast('¡Conectado! Tus datos ya viven en tu Google Drive');
  }catch(e){
    console.warn(e); setSync(M.mode === 'drive' ? 'auth' : 'local');
    toast(e.status === 403 ? 'Google rechazó el acceso. Revisa que las APIs de Drive y Sheets estén activadas.' : e.message === 'access_denied' ? 'Cancelaste el permiso de Google' : 'No se pudo conectar: ' + e.message);
  }
}
function disconnect(){
  if(!confirm('Se desconecta tu cuenta de Google en este equipo. Tus datos quedan guardados aquí y en tu Drive. ¿Continuar?')) return;
  try{ if(token) google.accounts.oauth2.revoke(token); }catch(e){}
  token = ''; M.mode = 'local'; M.sheetId = ''; M.dirty = []; M.user = ''; save(); setSync('local'); closeModal(); render();
}
function onSyncClick(){
  if(M.mode !== 'drive') return openSettings();
  if(syncState === 'auth'){ setSync('busy'); getToken(true).then(() => pullNow()).catch(syncErr); }
  else pullNow(true);
}

function dmStrip(s){ return s.replace(/[áàäâ]/g,'a').replace(/[éèëê]/g,'e').replace(/[íìïî]/g,'i').replace(/[óòöô]/g,'o').replace(/[úùüû]/g,'u'); }
function dmWordsVal(s){ return s.split(/\s+/).reduce((t, p) => t + (DM_NUM[p] || 0), 0); }
function dmHora(h, mi, mer, extra){
  h = Number(h); mi = Number(mi || 0); if(extra === 'media') mi = 30; if(extra === 'cuarto') mi = 15;
  if(h > 23 || mi > 59) return '';
  mer = mer || '';
  if(/pm|tarde|noche/.test(mer)){ if(h < 12) h += 12; }
  else if(/am|manana|madrugada/.test(mer)){ if(h === 12) h = 0; }
  else if(h >= 1 && h <= 6) h += 12;      // "a las 3" casi siempre es de la tarde
  return `${String(h).padStart(2,'0')}:${String(mi).padStart(2,'0')}`;
}
function dimeloParse(text, ctx){
  ctx = ctx || {};
  const now = ctx.now || new Date(), low = String(text || '').toLowerCase().trim(), n0 = dmStrip(low);
  let w = n0; const cuts = [];
  const cutSpan = (s, e) => { w = w.slice(0, s) + ' '.repeat(e - s) + w.slice(e); cuts.push([s, e]); };
  const take = re => { const m = re.exec(w); if(!m) return null; cutSpan(m.index, m.index + m[0].length); return m; };
  const has = re => re.test(n0);

  // 1. Hora
  let hora = '', m;
  if((m = take(/\ba las?\s+(\d{1,2})(?::(\d{2}))?(?:\s+y\s+(media|cuarto))?(?:\s*(am|pm|de la manana|de la tarde|de la noche|de la madrugada))?/))) hora = dmHora(m[1], m[2], m[4], m[3]);
  else if((m = take(/\ba las?\s+(una|dos|tres|cuatro|cinco|seis|siete|ocho|nueve|diez|once|doce)(?:\s+y\s+(media|cuarto))?(?:\s*(de la manana|de la tarde|de la noche|de la madrugada))?/))) hora = dmHora(DM_NUM[m[1]], 0, m[3], m[2]);
  else if((m = take(/\b(\d{1,2}):(\d{2})(?:\s*(am|pm))?/))) hora = dmHora(m[1], m[2], m[3]);
  else if((m = take(/\b(\d{1,2})\s*(am|pm)\b/))) hora = dmHora(m[1], 0, m[2]);
  else if(take(/\bmediodia\b/)) hora = '12:00';

  // 2. Fecha (se resuelve después, cuando se sabe si mira al pasado o al futuro)
  let raw = null;
  if(take(/\bpasado manana\b/)) raw = { k:'rel', n:2 };
  else if(take(/\b(anteayer|antier|antes de ayer)\b/)) raw = { k:'rel', n:-2 };
  else if(take(/\bayer\b/)) raw = { k:'rel', n:-1 };
  else if(take(/\bhoy\b/)) raw = { k:'rel', n:0 };
  else if((m = /\bmanana\b/.exec(w)) && !/\b(la|esta|de la)\s+$/.test(w.slice(0, m.index))){ cutSpan(m.index, m.index + 6); raw = { k:'rel', n:1 }; }
  if(!raw){
    if((m = take(/\ben\s+(\d+|un|una|dos|tres|cuatro|cinco|seis|siete|ocho|nueve|diez|quince)\s+dias?\b/))) raw = { k:'rel', n:Number(m[1]) || DM_NUM[m[1]] };
    else if((m = take(/\ben\s+(\d+|una|dos|tres|cuatro)\s+semanas?\b/))) raw = { k:'rel', n:7 * (Number(m[1]) || DM_NUM[m[1]]) };

const b64d = s => { s = s.replace(/-/g, '+').replace(/_/g, '/'); while(s.length % 4) s += '='; return Uint8Array.from(atob(s), c => c.charCodeAt(0)); };

      if(M.mode === 'drive' && !syncing){ if(M.dirty.length) flush(); else if(Date.now() - M.lastPull > 45000) pullNow(); }
    };
    if(LICENCIA_ON()) licenseGate().then(ok => { if(ok) go(); }); else go();
  });
  window.addEventListener('online', () => {
    if(locked){ if(Lic.code) licenseGate().then(ok => { if(ok) unlock(false); }); return; }
    if(M.mode === 'drive') M.dirty.length ? flush() : pullNow();
  });
  window.addEventListener('offline', () => { if(M.mode === 'drive' && !locked) setSync('offline'); });
  if(await licenseGate()) unlock(false);
}
init();
</script>
